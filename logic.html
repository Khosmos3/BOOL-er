<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOL-er</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #credit {
            position: fixed;
            margin-bottom: 2px;
            margin-left : 2px;
            bottom: 0;
            font-size: 18px;
        }

        #title {
            text-align: center;
            font-size: 120px;
            margin-top: 2%;
            font-weight: bold;
        }

        #container, #table {
            margin: auto;
            width: fit-content;
        }
    
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 3px;
        }

        #indicator {
            text-align: center;
            font-weight: bold;
        }

        #input, #container, #table {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="title">BOOL-er</div>
    <div id="credit">Tom Steen | 2024-2025 </div>
    <div id="container">
        <textarea id="input" placeholder="Thy statement" spellcheck="false"></textarea>
    </div>
    <table id = "table">
    </table>
    <div id="indicator"></div>
    
    <script src="logic.js"></script>
</body>
</html>
