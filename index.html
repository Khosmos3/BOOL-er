<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOL-er</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #credit {
            position: fixed;
            margin-bottom: 2px;
            margin-left : 2px;
            bottom: 0;
            font-size: 18px;
        }

        #about-link {
            position: fixed;
            margin-bottom: 2px;
            margin-right : 2px;
            bottom: 0;
            right: 0;
            font-size: 18px;
        }

        #title {
            font-size: 120px;
            margin-top: 2%;
            font-weight: bold;
        }

        #input-container, #table {
            width: fit-content;
        }
    
        table, th, td {
            border: 1px solid rgb(41, 41, 41);
            border-collapse: collapse;
            padding: 3px;
            text-align: center;
        }

        #indicator {
            text-align: center;
            font-weight: bold;
        }

        #input, #input-container, #table {
            font-size: 20px;
        }

        #content {
            display: grid;
            place-items: center;
            margin: auto;
        }

        #toggle-container {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div id="credit">Tom Steen | 2024-2026 </div>
    <div id="about-link"><a href="./about.html">Learn...</a></div>
    <div id="content">
        <div id="title">BOOL-er</div>
        <div id="input-container">
            <textarea id="input" placeholder="Thy statement" spellcheck="false"></textarea>
        </div>
        <table id = "table">
        </table>
        <div id="indicator"></div>
        <div id="toggle-container">
            <input type="checkbox" id="letter-number-toggle">
            <label for="letter-number-toggle">TF/10</label>
            <input type="checkbox" id="flip-toggle">
            <label for="flip-toggle">Flip</label>
        </div>
    </div>
    
    <script src="logic.js"></script>
</body>
</html>
