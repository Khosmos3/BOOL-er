<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOL-er</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #credit {
            position: fixed;
            margin-bottom: 2px;
            margin-left : 2px;
            bottom: 0;
            font-size: 18px;
        }

        #about-link {
            position: fixed;
            margin-bottom: 2px;
            margin-right : 2px;
            bottom: 0;
            right: 0;
            font-size: 18px;
        }

        #title {
            font-size: 120px;
            padding-top: 100px;
            font-weight: bold;
        }

        #input-container, #table {
            width: fit-content;
        }
    
        table, th, td {
            border: 1px solid rgb(41, 41, 41);
            border-collapse: collapse;
            padding: 3px;
            text-align: center;
        }

        #indicator {
            text-align: center;
            font-weight: bold;
        }

        #input, #input-container, #table {
            font-size: 20px;
        }

        #content {
            display: grid;
            place-items: center;
            margin: auto;
        }

        #toggle-container {
            margin: 10px;
        }

        #background {
            position: fixed;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="background"></canvas>
    <div id="credit">Tom Steen | 2024-2026 </div>
    <div id="about-link"><a href="./about.html">Learn...</a></div>
    <div id="content">
        <div id="title">BOOL-er</div>
        <div id="input-container">
            <textarea id="input" placeholder="Thy statement" spellcheck="false"></textarea>
        </div>
        <table id = "table">
        </table>
        <div id="indicator"></div>
        <div id="toggle-container">
            <input type="checkbox" id="letter-number-toggle">
            <label for="letter-number-toggle">TF/10</label>
            <input type="checkbox" id="flip-toggle">
            <label for="flip-toggle">Flip</label>
        </div>
    </div>
    
    <script src="logic.js"></script>
    <script src="math.js"></script>
    <script>
        const RES = 12;
        const WIDTH = window.screen.width;
        const HEIGHT = window.screen.height;
        let cvs = document.getElementById("background");
        cvs.width = WIDTH;
        cvs.height = HEIGHT;
        let c = cvs.getContext("2d");
        let T = 0;

        let titleScreenInterval = setInterval(() => {
            c.clearRect(0, 0, WIDTH, HEIGHT);

            let p = 0;
            for (let i = 0; i < WIDTH; i+=RES) {
                for (let j = 0; j < HEIGHT; j+=RES) { 
                    const speed = 0.004;
                    const frequency = 0.0045;

                    let v = new Vector(i - WIDTH/2, j - HEIGHT/3.5);
                    v.rotate(Math.sin(T/2000 + 4) * Math.pow(v.mag, 0.3));

                    p = Rand.perlin3D(v.x*frequency, v.y*frequency, T*speed, {octaves: 3});
                    p = clamp(remap(p, -1.3, 1.3, 0, 1), 0, 1);

                    if (p > 0.985)
                        c.fillStyle = "rgba(81, 240, 166, 0.4)";
                    else if (p > 0.9)
                        c.fillStyle = "rgba(81, 240, 166, 0.2)";
                    else if (p > 0.8)
                        c.fillStyle = "rgba(180, 240, 180, 0.2)";
                    else if (p > 0.7)
                        c.fillStyle = "rgba(240, 237, 240, 1.0)"
                    else if (p > 0.6)
                        c.fillStyle = "rgba(240, 237, 240, 0.7)"
                    else if (p > 0.4)
                        c.fillStyle = "rgba(240, 237, 240, 0.4)"
                    else if (p > 0.3)
                        c.fillStyle = "rgba(240, 237, 240, 0.7)"
                    else if (p > 0.2)
                        c.fillStyle = "rgba(240, 237, 240, 1.0)"
                    else if (p > 0.1)
                        c.fillStyle = "rgba(242, 100, 100, 0.2)";
                    else if (p > 0.015)
                        c.fillStyle = "rgba(242, 51, 83, 0.2)";
                    else
                        c.fillStyle = "rgba(242, 51, 83, 0.4)";
                    
                    
                    c.fillRect(i, j , RES, RES);
                    
                }
            }
            T+=1;
        }, 32);
    </script>
</body>
</html>
